<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUREUM — онлайн-аукцион</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="hero">
      <div class="container hero-grid">
        <div>
          <div class="eyebrow">Live auction house</div>
          <h1>Торги, которые<br>идут <em>сейчас</em></h1>
          <p class="lead">AUREUM — онлайн-аукцион искусства, часов, автомобилей и вина. Прозрачные ставки, эскроу-сделка и экспертиза каждого лота.</p>
          <div class="hero-actions">
            <a class="btn btn-gold" href="catalog.html">Смотреть лоты</a>
            <a class="btn btn-ghost" href="how.html">Как проходят торги</a>
          </div>
          <div class="stats">
            <div><b>128</b><span>лотов в сезоне</span></div>
            <div><b>41</b><span>страна участников</span></div>
            <div><b>98%</b><span>сделок закрыто</span></div>
          </div>
        </div>
        <article class="hero-card" id="hero-lot"></article>
      </div>
    </section>

    <section class="section" style="padding-top: 20px">
      <div class="container">
        <div class="section-head">
          <div>
            <div class="eyebrow">Featured</div>
            <h2>Избранные лоты</h2>
          </div>
          <a class="btn btn-ghost" href="catalog.html">Весь каталог</a>
        </div>
        <div class="cards" id="featured"></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const featured = window.AUREUM_LOTS.filter((l) => l.featured);
      document.getElementById("featured").innerHTML = featured.map(lotCard).join("");
      const hot = featured[0];
      const b = state.bids[hot.id];
      document.getElementById("hero-lot").innerHTML = `
        <img src="${hot.image}" alt="${hot.title}">
        <div class="hero-card-body">
          <span class="badge badge-live"><span class="pulse"></span> Идут торги</span>
          <h3 style="margin:12px 0 8px;font-size:30px">${hot.title}</h3>
          <div class="price-row">
            <span>Текущая<br><b>${money(b.current)}</b></span>
            <span>Осталось<br><b class="js-timer" data-end="${b.endsAt}">${remain(b.endsAt)}</b></span>
          </div>
          <a class="btn btn-live" style="margin-top:16px;display:inline-block" href="lot.html?id=${hot.id}">Сделать ставку</a>
        </div>
      `;
    });
  </script>
</body>
</html>
